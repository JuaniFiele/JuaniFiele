<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuaniFiele | Portfolio Rediseñado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-background: #0d1117;
      --color-primary: #161b22;
      --color-accent: #ff6f3c;
      --color-text-primary: #e6edf3;
      --color-text-secondary: #7d8590;
      --font-body: 'Inter', sans-serif;
      --font-code: 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--color-background);
      color: var(--color-text-primary);
      background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 2rem 2rem;
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
    .hero { text-align: center; margin-bottom: 3rem; }
    .hero .banner { max-width: 100%; border-radius: 12px; }
    .hero .typing-animation { margin-top: 1.5rem; display: inline-block; }
    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
    .card {
      background: rgba(22, 27, 34, 0.6);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4); }
    .card h2 {
      font-family: var(--font-code);
      color: var(--color-accent);
      margin-bottom: 1rem;
      border-bottom: 2px solid #30363d;
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .about-me p { margin-bottom: 0.75rem; }
    .about-me p:last-child { margin-bottom: 0; }
    .icon-list { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    
    /* === AJUSTE DE TAMAÑO DRÁSTICO === */
    .tech-stack .icon-list img {
        height: 25px; /* Iconos de tecnología muy pequeños */
    }
    .social-icons .icon-list img {
        height: 28px; /* Iconos sociales un poco más grandes pero pequeños */
    }
    /* === FIN DEL AJUSTE === */

    .icon-list a, .icon-list img { transition: transform 0.2s ease-in-out; }
    .icon-list a:hover, .icon-list img:hover { transform: scale(1.2); }
    .stats-container img, .trophies-container img { max-width: 100%; border-radius: 8px; margin-bottom: 1rem; }
    footer { text-align: center; margin-top: 4rem; padding: 1rem; color: var(--color-text-secondary); font-family: var(--font-code); }
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <img class="banner" src="https://capsule-render.vercel.app/api?type=waving&height=220&color=gradient&customColorList=12&text=Juan%20Ignacio%20Fiele&reversal=false&fontAlignY=32&fontSize=60&descSize=20&desc=Estudiante%20de%20Ingeniería%20en%20Sistemas%20de%20Información&descAlignY=50&descAlign=50" alt="Banner de bienvenida" />
      <div class="typing-animation"><a href="https://github.com/JuaniFiele"><img src="https://readme-typing-svg.herokuapp.com?font=Fira+Code&weight=700&size=24&pause=1000&color=FF6F3C¢er=true&vCenter=true&width=480&lines=Bienvenido+a+mi+perfil+profesional;+Explorando+el+mundo+del+código." alt="Animación de texto"></a></div>
    </header>
    <main class="main-grid">
      <div class="left-column">
        <section class="card about-me"><h2><svg ...>...</svg> Sobre Mí</h2> ... </section>
        <section class="card"><h2><svg ...>...</svg> Estadísticas de GitHub</h2> ... </section>
      </div>
      <div class="right-column">
        <!-- Añadí la clase 'tech-stack' para aplicar el estilo específico -->
        <section class="card tech-stack">
          <h2><svg ...>...</svg> Stack Tecnológico</h2>
          <div class="icon-list">
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/angularjs/angularjs-original.svg" alt="Angular" title="Angular" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/typescript/typescript-original.svg" alt="TypeScript" title="TypeScript" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/mysql/mysql-original-wordmark.svg" alt="MySQL" title="MySQL" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/html5/html5-original.svg" alt="HTML5" title="HTML5" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/css3/css3-original.svg" alt="CSS3" title="CSS3" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/javascript/javascript-original.svg" alt="JavaScript" title="JavaScript" />
            <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/git/git-original.svg" alt="Git" title="Git" />
          </div>
        </section>
        <section class="card social-icons">
          <h2><svg ...>...</svg> Conecta Conmigo</h2>
          <div class="icon-list">
            <a href="..." target="_blank"><img src="https://raw.githubusercontent.com/CLorant/readme-social-icons/main/large/filled/linkedin.svg" alt="LinkedIn"/></a>
            <!-- ... otros iconos sociales ... -->
          </div>
        </section>
        <section class="card"><h2><svg ...>...</svg> Trofeos de GitHub</h2> ... </section>
      </div>
    </main>
    <footer><p>Diseñado y desarrollado con ❤️ por Juan Ignacio Fiele</p></footer>
  </div>
</body>
</html>
